<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#d71920" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AREEN Sales" />
  <title>AREEN Sales</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="toastHost" class="toast-host" aria-live="polite"></div>

  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="./areen-logo.jpg" alt="AREEN TOP" />
      </div>
      <div class="auth-copy">
        <h1 data-i18n="loginTitle">نظام المبيعات ومتابعة المناديب</h1>
        <p data-i18n="loginSubtitle">تسجيل الدخول للوصول إلى العملاء والمبيعات والتقارير</p>
      </div>
      <form id="loginForm" class="stack-form" autocomplete="on">
        <label>
          <span data-i18n="username">اسم المستخدم</span>
          <input id="loginUsername" autocomplete="username" inputmode="email" placeholder="manager" required />
        </label>
        <label>
          <span data-i18n="password">كلمة المرور</span>
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </label>
        <button id="loginBtn" class="btn btn-primary btn-block" type="submit" data-i18n="login">تسجيل الدخول</button>
      </form>
      <div class="auth-footer">
        <button id="authLangToggle" class="btn btn-ghost btn-sm" type="button">English</button>
        <span class="muted">AREEN TOP</span>
      </div>
    </div>
  </section>

  <div id="appShell" class="app-shell hidden">
    <aside id="desktopSidebar" class="sidebar">
      <div class="sidebar-brand">
        <img src="./areen-logo.jpg" alt="AREEN TOP" />
      </div>
      <nav id="desktopNav" class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div id="sidebarUser" class="sidebar-user"></div>
        <button id="logoutBtnDesktop" class="btn btn-dark btn-block" type="button" data-i18n="logout">تسجيل الخروج</button>
      </div>
    </aside>

    <main class="main-shell">
      <header class="topbar">
        <div class="topbar-leading">
          <button id="mobileMenuBtn" class="icon-btn only-mobile" type="button" aria-label="Menu">☰</button>
          <div>
            <h2 id="pageTitle">AREEN</h2>
            <p id="pageSubtitle" class="muted"></p>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="langToggle" class="btn btn-outline btn-sm" type="button">English</button>
          <div id="topUserBadge" class="user-badge"></div>
        </div>
      </header>

      <section id="pageContent" class="page-content"></section>
    </main>

    <nav id="mobileBottomNav" class="mobile-bottom-nav"></nav>
  </div>

  <div id="mobileDrawer" class="drawer-backdrop hidden">
    <div class="drawer-panel">
      <div class="drawer-head">
        <img src="./areen-logo.jpg" alt="AREEN TOP" />
        <button id="closeDrawerBtn" class="icon-btn" type="button">×</button>
      </div>
      <nav id="drawerNav" class="drawer-nav"></nav>
      <button id="logoutBtnMobile" class="btn btn-dark btn-block" type="button" data-i18n="logout">تسجيل الخروج</button>
    </div>
  </div>

  <div id="modalRoot" class="modal-root hidden" aria-hidden="true"></div>

  <template id="loadingTemplate">
    <div class="loading-state">
      <div class="spinner"></div>
      <p data-i18n="loading">جاري التحميل...</p>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
